<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shree Sai Business - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="brand">
                <div class="brand-logo">श्री साई</div>

                <h1>Shree Sai Business</h1>

                <p>
                    कर्मचारी व्यवस्थापन प्रणाली
                </p>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label>
                        मोबाईल / User Name
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Username टाका"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password टाका"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Login
                </button>

            </form>


            <div
                id="loginError"
                class="error-message"
            ></div>

        </div>

    </div>


    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

</body>

</html>
